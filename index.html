<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>audioMotion + ESP32 LCD</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#ccc;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{background:#1a1a1e;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333;position:sticky;top:0;z-index:10}
header h1{font-size:15px;color:#00e5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{font-size:11px;font-weight:bold;padding:3px 8px;border-radius:12px;background:#333;white-space:nowrap}
#st.ok{color:#00e5ff;background:#003344}
#st.er{color:#ff1744;background:#330011}
#st.warn{color:#ffa726;background:#332200}
#container{width:100%;height:35vh;background:#000;position:relative}
#container canvas{display:block;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#1a1a1e;border-bottom:1px solid #333;align-items:center}
.row button,.lbl-btn{background:#333;color:#ccc;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap}
.row button:active{background:#555}
.row button.on{background:#00b0ff;color:#fff}
input[type="file"]{display:none}
.lbl-btn{display:inline-block}
#au{width:100%;display:block;height:36px}
#sst{font-size:11px;color:#888;margin-left:auto}

.esp32-section{background:#1a1a1e;border-bottom:1px solid #333;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.esp32-section input[type="text"]{background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:4px 8px;font-size:12px;width:130px;font-family:monospace}
.esp32-section label{color:#aaa;font-size:11px}
#espStat{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;background:#333}
#espStat.off{color:#ff1744}
#espStat.on{color:#00e5ff;background:#003344}
#espStat.sending{color:#ffa726;background:#332200}

.settings{border-bottom:1px solid #222;font-size:12px}
.settings summary{padding:8px 12px;cursor:pointer;color:#00e5ff;font-weight:bold;user-select:none}
.settings details{border-bottom:1px solid #222}
.sg{display:flex;flex-wrap:wrap;gap:6px 12px;padding:6px 12px 10px}
.sg label{display:flex;align-items:center;gap:4px;color:#aaa;font-size:11px}
.sg label span.hl{color:#888;min-width:30px}
.sg select{background:#222;color:#fff;border:1px solid #444;border-radius:4px;padding:3px 4px;font-size:11px}
.sg input[type="range"]{width:70px}
.sg input[type="number"]{width:50px;background:#222;color:#fff;border:1px solid #444;border-radius:3px;padding:2px 4px;font-size:11px}
.sg .val{min-width:28px;text-align:right;color:#0f0;font-family:monospace;font-size:11px}
.sg button.tgl{background:#333;color:#888;border:1px solid #555;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}
.sg button.tgl.on{background:#0f0;color:#000;border-color:#0f0}
.sg .hlp{color:#666;font-size:10px;margin-left:2px;text-decoration:none;cursor:help}

footer{padding:12px;text-align:center;font-size:11px;color:#555}
</style>
</head>
<body>

<header>
  <h1>audioMotion + ESP32 LCD</h1>
  <span id="st" class="er">Offline</span>
</header>

<div class="row">
  <label class="lbl-btn" for="up">Open File</label><input type="file" id="up" accept="audio/*">
  <button id="btnMic">Mic</button>
  <button id="btnTab">Tab Audio</button>
  <span id="sst">No source</span>
</div>

<audio id="au" controls playsinline></audio>

<div id="container"></div>

<div class="esp32-section">
  <label>ESP32 IP:</label>
  <input type="text" id="espIP" placeholder="192.168.x.x" maxlength="15">
  <button id="btnEsp">Connect</button>
  <span id="espStat" class="off">Offline</span>
  <label>fps</label>
  <select id="espFps">
    <option value="15">15</option>
    <option value="20">20</option>
    <option value="25">25</option>
    <option value="30" selected>30</option>
    <option value="50">50</option>
    <option value="60">60</option>
  </select>
</div>

<div class="settings">
<details>
  <summary>⚙️ Settings</summary>

  <details>
    <summary>Presets</summary>
    <div class="sg">
      <label><select id="presets" style="width:200px"></select></label>
    </div>
  </details>

  <details>
    <summary>Mode</summary>
    <div class="sg">
      <label><span class="hl">mode</span>
        <select id="s_mode">
          <option value="0">[0] Discrete frequencies</option>
          <option value="1">[1] 1/24 oct / 240 bands</option>
          <option value="2">[2] 1/12 oct / 120 bands</option>
          <option value="3">[3] 1/8 oct / 80 bands</option>
          <option value="4">[4] 1/6 oct / 60 bands</option>
          <option value="5">[5] 1/4 oct / 40 bands</option>
          <option value="6" selected>[6] 1/3 oct / 30 bands</option>
          <option value="7">[7] Half oct / 20 bands</option>
          <option value="8">[8] Full oct / 10 bands</option>
          <option value="10">[10] Line / Area graph</option>
        </select>
      </label>
    </div>
  </details>

  <details>
    <summary>FFT</summary>
    <div class="sg">
      <label><span class="hl">fftSize</span>
        <select id="s_fftSize">
          <option value="1024">1024</option>
          <option value="2048">2048</option>
          <option value="4096">4096</option>
          <option value="8192">8192</option>
          <option value="16384">16384</option>
          <option value="32768">32768</option>
        </select>
      </label>
      <label><span class="hl">smoothing</span>
        <input type="range" id="s_smoothing" min="0" max=".9" step=".1" value=".5">
        <span class="val" id="v_smoothing">0.5</span>
      </label>
    </div>
  </details>

  <details>
    <summary>Frequency range &amp; scaling</summary>
    <div class="sg">
      <label><span class="hl">minFreq</span>
        <select id="s_minFreq">
          <option value="10">10</option><option value="16">16</option>
          <option value="20" selected>20</option><option value="25">25</option>
          <option value="30">30</option><option value="40">40</option>
          <option value="60">60</option><option value="100">100</option>
          <option value="500">500</option><option value="1000">1000</option>
        </select>
      </label>
      <label><span class="hl">maxFreq</span>
        <select id="s_maxFreq">
          <option value="8000">8000</option><option value="10000">10000</option>
          <option value="12000">12000</option><option value="16000">16000</option>
          <option value="20000" selected>20000</option><option value="22000">22000</option>
          <option value="24000">24000</option>
        </select>
      </label>
      <label><span class="hl">scale</span>
        <select id="s_frequencyScale">
          <option value="bark">Bark</option>
          <option value="linear">Linear</option>
          <option value="log" selected>Log</option>
          <option value="mel">Mel</option>
        </select>
      </label>
    </div>
  </details>

  <details>
    <summary>Sensitivity</summary>
    <div class="sg">
      <label><span class="hl">filter</span>
        <select id="s_weightingFilter">
          <option value="">none</option><option value="A">A</option>
          <option value="B">B</option><option value="C">C</option>
          <option value="D">D</option><option value="468">468</option>
        </select>
      </label>
      <label><span class="hl">min dB</span>
        <input type="range" id="s_minDecibels" min="-120" max="-60" step="5" value="-85">
        <span class="val" id="v_minDecibels">-85</span>
      </label>
      <label><span class="hl">max dB</span>
        <input type="range" id="s_maxDecibels" min="-40" max="0" step="5" value="-25">
        <span class="val" id="v_maxDecibels">-25</span>
      </label>
    </div>
  </details>

  <details>
    <summary>Linear amplitude</summary>
    <div class="sg">
      <label><button class="tgl" id="s_linearAmplitude">linearAmplitude</button></label>
      <label><span class="hl">boost</span>
        <input type="range" id="s_linearBoost" min="1" max="4" step=".2" value="1">
        <span class="val" id="v_linearBoost">1.0</span>
      </label>
    </div>
  </details>

  <details>
    <summary>Display</summary>
    <div class="sg">
      <label><span class="hl">barSpace</span>
        <input type="range" id="s_barSpace" min="0" max="1" step=".05" value="0.1">
        <span class="val" id="v_barSpace">0.1</span>
      </label>
      <label><span class="hl">channel</span>
        <select id="s_channelLayout">
          <option value="single">Single</option>
          <option value="dual-vertical">Dual-V</option>
          <option value="dual-horizontal">Dual-H</option>
          <option value="dual-combined">Dual-C</option>
        </select>
      </label>
      <label><span class="hl">color</span>
        <select id="s_colorMode">
          <option value="gradient">Gradient</option>
          <option value="bar-index">Bar index</option>
          <option value="bar-level">Bar level</option>
        </select>
      </label>
      <label><span class="hl">gradient</span>
        <select id="s_gradient">
          <option value="classic">Classic</option>
          <option value="prism">Prism</option>
          <option value="rainbow">Rainbow</option>
          <option value="orangered">OrangeRed</option>
          <option value="steelblue">SteelBlue</option>
        </select>
      </label>
      <label><span class="hl">mirror</span>
        <select id="s_mirror">
          <option value="0">Off</option>
          <option value="-1">Left</option>
          <option value="1">Right</option>
        </select>
      </label>
      <label><span class="hl">reflex</span>
        <input type="range" id="s_reflexRatio" min="0" max=".9" step=".05" value="0">
        <span class="val" id="v_reflexRatio">0</span>
      </label>
    </div>
    <div class="sg">
      <button class="tgl" id="s_ledBars">ledBars</button>
      <button class="tgl" id="s_lumiBars">lumiBars</button>
      <button class="tgl" id="s_showPeaks">showPeaks</button>
      <button class="tgl" id="s_showScaleX">showScaleX</button>
      <button class="tgl" id="s_showBgColor">showBgColor</button>
      <button class="tgl" id="s_radial">radial</button>
      <button class="tgl" id="s_alphaBars">alphaBars</button>
      <button class="tgl" id="s_outlineBars">outlineBars</button>
      <button class="tgl" id="s_roundBars">roundBars</button>
      <button class="tgl" id="s_ansiBands">ansiBands</button>
      <button class="tgl" id="s_trueLeds">trueLeds</button>
      <button class="tgl" id="s_showFPS">showFPS</button>
    </div>
  </details>

</details>
</div>

<footer>audioMotion-analyzer v<span id="version"></span> &mdash; FFT runs in browser, ESP32 is dumb display</footer>

<script src="https://cdn.jsdelivr.net/npm/audiomotion-analyzer@4.5.4/dist/audioMotion-analyzer.min.js"></script>
<script>
"use strict";

// ── DOM refs ──
const $ = id => document.getElementById(id);
const au = $('au');
const st = $('st'), sst = $('sst');
const espIP = $('espIP'), btnEsp = $('btnEsp'), espStat = $('espStat'), espFps = $('espFps');

// ── Logging ──
function status(t, c) { st.textContent = t; st.className = c || 'er'; }

// Lists of settings for updateUI
const SETTINGS_SELECT = ['mode','fftSize','minFreq','maxFreq','frequencyScale','weightingFilter','channelLayout','colorMode','gradient','mirror'];
const SETTINGS_RANGE = ['smoothing','minDecibels','maxDecibels','barSpace','reflexRatio','linearBoost'];
const SETTINGS_TOGGLE = ['linearAmplitude','ledBars','lumiBars','showPeaks','showScaleX','showBgColor','radial','alphaBars','outlineBars','roundBars','ansiBands','trueLeds','showFPS'];

// ── Presets (from fluid demo) ──
const presets = [
  { name: 'Reset to defaults', options: undefined },
  { name: 'Classic LED bars', options: { mode: 6, alphaBars: false, ansiBands: true, barSpace: .5, channelLayout: 'single', colorMode: 'gradient', frequencyScale: 'log', gradient: 'classic', ledBars: true, lumiBars: false, maxFreq: 20000, minFreq: 25, mirror: 0, radial: false, reflexRatio: 0, showBgColor: true, showPeaks: true, trueLeds: true } },
  { name: 'Mirror wave', options: { mode: 10, channelLayout: 'single', fillAlpha: .6, gradient: 'rainbow', lineWidth: 1.5, maxFreq: 20000, minFreq: 30, mirror: -1, radial: false, reflexAlpha: 1, reflexBright: 1, reflexRatio: .5, showPeaks: false, showScaleX: false } },
  { name: 'Radial spectrum + Overlay', options: { mode: 5, barSpace: .1, channelLayout: 'single', gradient: 'prism', ledBars: false, maxFreq: 20000, minFreq: 20, mirror: 0, radial: true, showBgColor: true, showPeaks: true, spinSpeed: 1, overlay: true } },
  { name: 'Bark scale + Linear amplitude', options: { mode: 0, channelLayout: 'single', frequencyScale: 'bark', gradient: 'rainbow', linearAmplitude: true, linearBoost: 1.8, maxFreq: 20000, minFreq: 20, mirror: 0, overlay: false, radial: false, reflexAlpha: .25, reflexBright: 1, reflexFit: true, reflexRatio: .3, showPeaks: true, showScaleX: true, weightingFilter: 'D' } },
  { name: 'Dual channel combined', options: { mode: 10, channelLayout: 'dual-combined', fillAlpha: .25, frequencyScale: 'bark', gradientLeft: 'steelblue', gradientRight: 'orangered', linearAmplitude: true, linearBoost: 1.8, lineWidth: 1.5, maxFreq: 20000, minFreq: 20, mirror: 0, overlay: false, radial: false, reflexRatio: 0, showPeaks: false, weightingFilter: 'D' } },
  { name: 'roundBars + bar-level', options: { mode: 2, alphaBars: false, ansiBands: false, barSpace: .25, channelLayout: 'single', colorMode: 'bar-level', frequencyScale: 'log', gradient: 'prism', ledBars: false, linearAmplitude: true, linearBoost: 1.6, lumiBars: false, maxFreq: 16000, minFreq: 30, mirror: 0, radial: false, reflexRatio: .5, reflexAlpha: 1, roundBars: true, showPeaks: false, showScaleX: false, smoothing: .7, weightingFilter: 'D' } },
];

// ── Create audioMotion-analyzer ──
const audioMotion = new AudioMotionAnalyzer(
  document.getElementById('container'),
  {
    source: au,
    start: false,
    mode: 6,
    minFreq: 20,
    maxFreq: 20000,
    minDecibels: -85,
    maxDecibels: -25,
    smoothing: 0.5,
    barSpace: 0.1,
    ledBars: false,
    lumiBars: false,
    showPeaks: true,
    showScaleX: true,
    showBgColor: true,
    showFPS: false,
    gradient: 'classic',
    radial: false,
    reflexRatio: 0,
    mirror: 0,
    frequencyScale: 'log',
    weightingFilter: '',
    linearAmplitude: false,
    linearBoost: 1,
    alphaBars: false,
    outlineBars: false,
    roundBars: false,
    ansiBands: false,
    trueLeds: false,
    channelLayout: 'single',
    colorMode: 'gradient',
    overlay: false,
    reflexAlpha: 0.15,
    reflexBright: 1,
    reflexFit: true,
    spinSpeed: 0,
    fillAlpha: 1,
    lineWidth: 0,
    volume: 1
  }
);

audioMotion.start();
document.getElementById('version').textContent = AudioMotionAnalyzer.version;

// ── Settings <-> audioMotion binding ──
function getVal(el) {
  if (el.type === 'range' || el.type === 'number') return +el.value;
  if (el.tagName === 'SELECT') {
    const v = el.value;
    const n = +v;
    if (!isNaN(n) && v !== '') return n;
    return v;
  }
  return el.value;
}

// Update all UI from audioMotion state
function updateUI() {
  // Select elements
  SETTINGS_SELECT.forEach(p => {
    const el = document.getElementById('s_' + p);
    if (el) el.value = audioMotion[p];
  });
  // Range inputs + value displays
  SETTINGS_RANGE.forEach(p => {
    const el = document.getElementById('s_' + p);
    if (el) {
      el.value = audioMotion[p];
      const sib = el.nextElementSibling;
      if (sib && sib.classList.contains('val')) sib.textContent = el.value;
    }
  });
  // Toggle buttons
  SETTINGS_TOGGLE.forEach(p => {
    const el = document.getElementById('s_' + p);
    if (el) el.classList.toggle('on', !!audioMotion[p]);
  });
}

// Wire select/range elements by id
function wireById(id, prop) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('change', () => {
    audioMotion[prop] = getVal(el);
    if (el.type === 'range') {
      const sib = el.nextElementSibling;
      if (sib && sib.classList.contains('val')) sib.textContent = el.value;
    }
  });
  el.addEventListener('input', () => {
    if (el.type === 'range') {
      audioMotion[prop] = +el.value;
      const sib = el.nextElementSibling;
      if (sib && sib.classList.contains('val')) sib.textContent = el.value;
    }
  });
}

// Wire toggle buttons by id
function wireToggleById(id, prop) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', () => {
    audioMotion[prop] = !audioMotion[prop];
    el.classList.toggle('on', !!audioMotion[prop]);
  });
}

// Wire all settings
wireById('s_mode', 'mode');
wireById('s_fftSize', 'fftSize');
wireById('s_smoothing', 'smoothing');
wireById('s_minFreq', 'minFreq');
wireById('s_maxFreq', 'maxFreq');
wireById('s_frequencyScale', 'frequencyScale');
wireById('s_weightingFilter', 'weightingFilter');
wireById('s_minDecibels', 'minDecibels');
wireById('s_maxDecibels', 'maxDecibels');
wireById('s_barSpace', 'barSpace');
wireById('s_channelLayout', 'channelLayout');
wireById('s_colorMode', 'colorMode');
wireById('s_gradient', 'gradient');
wireById('s_mirror', 'mirror');
wireById('s_reflexRatio', 'reflexRatio');
wireById('s_linearBoost', 'linearBoost');
wireToggleById('s_linearAmplitude', 'linearAmplitude');
wireToggleById('s_ledBars', 'ledBars');
wireToggleById('s_lumiBars', 'lumiBars');
wireToggleById('s_showPeaks', 'showPeaks');
wireToggleById('s_showScaleX', 'showScaleX');
wireToggleById('s_showBgColor', 'showBgColor');
wireToggleById('s_radial', 'radial');
wireToggleById('s_alphaBars', 'alphaBars');
wireToggleById('s_outlineBars', 'outlineBars');
wireToggleById('s_roundBars', 'roundBars');
wireToggleById('s_ansiBands', 'ansiBands');
wireToggleById('s_trueLeds', 'trueLeds');
wireToggleById('s_showFPS', 'showFPS');

// ── Presets ──
const presetSel = document.getElementById('presets');
presets.forEach((p, i) => {
  const opt = new Option(p.name, i);
  presetSel.append(opt);
});
presetSel.addEventListener('change', () => {
  const opts = presets[presetSel.value].options;
  if (opts) audioMotion.setOptions(opts);
  else audioMotion.setOptions({ mode: 0, minFreq: 20, maxFreq: 20000, minDecibels: -85, maxDecibels: -25, smoothing: 0.5, barSpace: 0.1, ledBars: false, lumiBars: false, showPeaks: true, showScaleX: true, showBgColor: true, gradient: 'classic', radial: false, reflexRatio: 0, mirror: 0, frequencyScale: 'log', weightingFilter: '', linearAmplitude: false, linearBoost: 1, alphaBars: false, outlineBars: false, roundBars: false, ansiBands: false, trueLeds: false, channelLayout: 'single', colorMode: 'gradient', showFPS: false });
  updateUI();
});

// ── Audio Sources ──
// File upload
$('up').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  au.src = URL.createObjectURL(f);
  au.play().then(() => sst.textContent = f.name).catch(() => {});
});

// Mic
let micStream = null;
$('btnMic').addEventListener('click', () => {
  if (micStream) {
    audioMotion.disconnectInput(micStream, true);
    micStream = null;
    $('btnMic').classList.remove('on');
    sst.textContent = 'No source';
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      micStream = audioMotion.audioCtx.createMediaStreamSource(stream);
      audioMotion.connectInput(micStream);
      $('btnMic').classList.add('on');
      sst.textContent = 'Mic active';
    })
    .catch(() => alert('Microphone access denied'));
});

// Tab audio
let tabStream = null;
$('btnTab').addEventListener('click', () => {
  if (tabStream) {
    tabStream.getTracks().forEach(t => t.stop());
    tabStream = null;
    $('btnTab').classList.remove('on');
    sst.textContent = 'No source';
    return;
  }
  navigator.mediaDevices.getDisplayMedia({ audio: true, video: true })
    .then(stream => {
      stream.getVideoTracks().forEach(t => t.stop());
      tabStream = stream;
      const src = audioMotion.audioCtx.createMediaStreamSource(stream);
      audioMotion.connectInput(src);
      $('btnTab').classList.add('on');
      sst.textContent = 'Tab audio';
      stream.getAudioTracks()[0].addEventListener('ended', () => {
        $('btnTab').classList.remove('on');
        tabStream = null;
        sst.textContent = 'No source';
      });
    })
    .catch(() => {});
});

// When audio element plays, ensure audioMotion has source connected
au.addEventListener('play', () => {
  sst.textContent = au.src ? au.src.split('/').pop() || 'Playing' : 'Playing';
});

// ── ESP32 WiFi Streaming ──
// Uses Image() instead of fetch() to bypass HTTPS→HTTP mixed content blocking.
// Images are "optionally-blockable" content — most browsers allow them by default.
let espTimer = null;
let espSending = false;
let espConnected = false;

// Restore saved IP
const savedIP = localStorage.getItem('esp32_ip');
if (savedIP) espIP.value = savedIP;

function espSend() {
  if (!espConnected || !audioMotion) return;
  const bars = audioMotion.getBars();
  if (!bars || bars.length === 0) return;

  // Downsample to 16 values, map 0-1 to 0-16
  const N = bars.length;
  const vals = new Array(16).fill(0);
  for (let i = 0; i < N; i++) {
    const idx = Math.min(15, Math.floor((i / N) * 16));
    if (bars[i].value > vals[idx]) vals[idx] = bars[i].value;
  }
  const heights = vals.map(v => Math.max(0, Math.min(16, Math.round(v * 16))));

  // Image() request — works from HTTPS pages to HTTP endpoints (optionally-blockable content)
  new Image().src = `http://${espIP.value}/s?d=${heights.join(',')}`;

  if (!espSending) {
    espSending = true;
    espStat.className = 'sending';
    espStat.textContent = 'Streaming';
    status('Streaming', 'ok');
  }
}

function espConnect() {
  const ip = espIP.value.trim();
  if (!ip) { alert('Enter ESP32 IP address'); return; }

  localStorage.setItem('esp32_ip', ip);
  espConnected = true;
  btnEsp.textContent = 'Disconnect';
  espStat.className = 'on';
  espStat.textContent = 'Connected';
  status('Connected', 'ok');

  // Start send loop
  const interval = Math.round(1000 / parseInt(espFps.value));
  if (espTimer) clearInterval(espTimer);
  espTimer = setInterval(espSend, interval);
}

function espDisconnect() {
  espConnected = false;
  espSending = false;
  btnEsp.textContent = 'Connect';
  espStat.className = 'off';
  espStat.textContent = 'Offline';
  status('Offline', 'er');
  if (espTimer) { clearInterval(espTimer); espTimer = null; }
}

btnEsp.addEventListener('click', () => {
  if (espConnected) espDisconnect();
  else espConnect();
});

espFps.addEventListener('change', () => {
  if (espConnected) {
    if (espTimer) clearInterval(espTimer);
    const interval = Math.round(1000 / parseInt(espFps.value));
    espTimer = setInterval(espSend, interval);
  }
});

// ── Init UI ──
updateUI();
</script>
</body>
</html>
